<text x="122" y="930.0" class="lanetext" text-anchor="middle">System SportRent</text><circle cx="260" cy="225" r="18" class="event"/><rect x="310" y="180" width="180" height="90" class="task"/><text x="400.0" y="207" class="tasktext">Przeglądaj ofertę</text><text x="400.0" y="226" class="tasktext">i dostępność online</text><rect x="535" y="180" width="175" height="90" class="task"/><text x="622.5" y="207" class="tasktext">Wybierz sprzęt</text><text x="622.5" y="226" class="tasktext">i sprawdź szczegóły</text><rect x="755" y="180" width="180" height="90" class="task"/><text x="845.0" y="207" class="tasktext">Zaloguj się /</text><text x="845.0" y="226" class="tasktext">załóż konto</text><polygon points="1015,189.0 1051.0,225 1015,261.0 979.0,225" class="gateway"/><rect x="1110" y="175" width="190" height="100" class="task"/><text x="1205.0" y="202" class="tasktext">Zgłoś się do</text><text x="1205.0" y="221" class="tasktext">pracownika w punkcie</text><circle cx="1450" cy="225" r="19" class="end"/><text x="246" y="193" class="label">Start</text><text x="1415" y="193" class="label">Kontynuacja</text><rect x="300" y="485" width="190" height="90" class="task"/><text x="395.0" y="512" class="tasktext">Uwierzytelnij się</text><text x="395.0" y="531" class="tasktext">w panelu pracownika</text><polygon points="565,494.0 601.0,530 565,566.0 529.0,530" class="gateway"/><rect x="665" y="485" width="200" height="90" class="task"/><text x="765.0" y="512" class="tasktext">Wybierz klienta</text><text x="765.0" y="531" class="tasktext">i sprzęt</text><rect x="925" y="485" width="210" height="90" class="task"/><text x="1030.0" y="512" class="tasktext">Wprowadź dane</text><text x="1030.0" y="531" class="tasktext">i termin zwrotu</text><rect x="1195" y="485" width="190" height="90" class="task"/><text x="1290.0" y="512" class="tasktext">Wydaj sprzęt</text><text x="1290.0" y="531" class="tasktext">klientowi</text><circle cx="1500" cy="530" r="19" class="end"/><rect x="300" y="850" width